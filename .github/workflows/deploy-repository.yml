name: Deploy OpenSubtitles Repository

on:
  push:
    tags:
      - "v*"
    branches:
      - master
      - v1.0.15
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate Repository Archives & Portal
        run: |
          python scripts/generate_repo.py

      - name: Deploy to gh-pages Branch
        # SHA-pinned: this step holds write access to gh-pages (the live user
        # feed) - a hijacked upstream tag must not be able to ride in (v4)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo_output
          publish_branch: gh-pages
          force_orphan: true
          # Without this the action publishes gh-pages with NO CNAME file and
          # GitHub silently drops the custom-domain binding - the feed then 404s
          # on kodi.opensubtitles.com (happened live 2026-08-20).
          cname: kodi.opensubtitles.com

      - name: Create / Update GitHub Release (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        # SHA-pinned: publishes release artifacts users download (v3)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            repo_output/repository.opensubtitles-com.zip
            repo_output/zips/service.subtitles.opensubtitles-com/*.zip
            repo_output/addons.xml
            repo_output/addons.xml.md5
            repo_output/addons.xml.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
