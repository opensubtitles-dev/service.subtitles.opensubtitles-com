name: Deploy OpenSubtitles Repository

on:
  push:
    tags:
      - "v*"
    branches:
      - master
      - v1.0.15
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # ONLY the main repo may run this job. It publishes gh-pages with
    # `cname: kodi.opensubtitles.com`, and a GitHub Pages custom domain can be
    # bound to exactly one repository - so the same workflow running on the
    # opensubtitles/ workbench fork TAKES THE DOMAIN OVER and starts serving the
    # fork's addons.xml to every installed user. That happened live on
    # 2026-10-19: a `v2.0.0-beta.1` tag pushed to the fork matched the `v*`
    # trigger below, the fork's deploy claimed kodi.opensubtitles.com, and the
    # feed advertised 2.0.0 to the whole 1.x install base for ~4 minutes until
    # the domain was rebound and Pages rebuilt. The guard makes a fork push or
    # fork tag a no-op instead of an outage.
    if: github.repository == 'opensubtitles-dev/service.subtitles.opensubtitles-com'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7, SHA-pinned
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7, SHA-pinned
        with:
          python-version: "3.11"

      - name: Generate Repository Archives & Portal
        run: |
          python scripts/generate_repo.py

      - name: Deploy to gh-pages Branch
        # SHA-pinned: this step holds write access to gh-pages (the live user
        # feed) - a hijacked upstream tag must not be able to ride in (v4)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo_output
          publish_branch: gh-pages
          force_orphan: true
          # Without this the action publishes gh-pages with NO CNAME file and
          # GitHub silently drops the custom-domain binding - the feed then 404s
          # on kodi.opensubtitles.com (happened live 2026-08-20).
          cname: kodi.opensubtitles.com

      - name: Create / Update GitHub Release (Tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        # SHA-pinned: publishes release artifacts users download (v3)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            repo_output/repository.opensubtitles-com.zip
            repo_output/zips/service.subtitles.opensubtitles-com/*.zip
            repo_output/addons.xml
            repo_output/addons.xml.md5
            repo_output/addons.xml.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
