name: Kodi Addon Checker & CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  test:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Kodi embeds different Pythons per release: Matrix (19) ~3.8,
        # Nexus (20) ~3.8/3.11, Omega (21) ~3.11, Piers (22) ~3.12+.
        # A 3.8-incompatible construct would pass a 3.11-only CI and crash
        # every Matrix user - the full spread keeps us honest.
        python-version: ["3.8", "3.9", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run Pytest
        run: |
          python -m pytest

      - name: Preflight gate (version consistency + shipped-zip inspection)
        run: |
          python scripts/preflight.py --fast

      - name: Kodiai-equivalent gate (entry-point size, deps on mirrors)
        # Team Kodi's Kodiai bot is a private app; these are its deterministic
        # checks reproduced locally so upstream never sees them fail first.
        if: matrix.python-version == '3.11'
        run: |
          python scripts/kodiai_gate.py

      - name: Shipped-code minimum Python audit (vermin)
        # Guards the real Kodi Matrix floor - the Matrix-era containers run
        # Python 3.6.9 (Ubuntu 18.04 system python), older than CI can execute,
        # so the floor is enforced statically. Shipped files only; tests and
        # dev scripts may use newer Python freely. vendor_qrcodegen.py is the
        # one sanctioned 3.7 file: qr_dialog imports it lazily and falls back
        # to a plain URL dialog on 3.6.
        if: matrix.python-version == '3.11'
        run: |
          pip install vermin
          vermin --no-tips --violations -t=3.6- \
            $(git ls-files '*.py' \
              | grep -v -e '^tests/' -e '^scripts/' -e 'vendor_qrcodegen')

  kodi-addon-checker:
    name: Kodi Validator (${{ matrix.kodi-version }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        kodi-version: [matrix, nexus, omega, piers]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install kodi-addon-checker
        run: |
          python -m pip install --upgrade pip
          pip install kodi-addon-checker requests

      - name: Package Clean Add-on
        run: |
          python scripts/generate_repo.py
          mkdir -p /tmp/clean_addon
          unzip -q repo_output/zips/service.subtitles.opensubtitles-com/service.subtitles.opensubtitles-com-*.zip -d /tmp/clean_addon

      - name: Validate Add-on with kodi-addon-checker
        run: |
          # The checker downloads mirrors.kodi.tv repo indexes; a slow mirror makes it
          # crash internally (AttributeError: 'Repository' object has no attribute
          # 'addons'). That is their flake, not our add-on - retry up to 3 times.
          for attempt in 1 2 3; do
            if kodi-addon-checker --branch ${{ matrix.kodi-version }} --allow-folder-id-mismatch /tmp/clean_addon/service.subtitles.opensubtitles-com; then
              exit 0
            fi
            echo "kodi-addon-checker attempt $attempt failed (mirror flake?), retrying in 30s..."
            sleep 30
          done
          exit 1
