name: Kodi Addon Checker & CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  test:
    name: Pytest Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run Pytest
        run: |
          python -m pytest

  kodi-addon-checker:
    name: Kodi Validator (${{ matrix.kodi-version }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        kodi-version: [matrix, nexus, omega, piers]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install kodi-addon-checker
        run: |
          python -m pip install --upgrade pip
          pip install kodi-addon-checker requests

      - name: Package Clean Add-on
        run: |
          python scripts/generate_repo.py
          mkdir -p /tmp/clean_addon
          unzip -q repo_output/zips/service.subtitles.opensubtitles-com/service.subtitles.opensubtitles-com-*.zip -d /tmp/clean_addon

      - name: Validate Add-on with kodi-addon-checker
        run: |
          kodi-addon-checker --branch ${{ matrix.kodi-version }} --allow-folder-id-mismatch /tmp/clean_addon/service.subtitles.opensubtitles-com
